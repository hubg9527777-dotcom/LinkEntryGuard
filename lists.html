<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkEntryGuard · 名单管理</title><link rel="stylesheet" href="lists.css"></head><body class="manager"><main><header><div><small>LinkEntryGuard · 1.0.2</small><h1>名单管理</h1></div><span id="total"></span><button type="button" id="retryList" hidden>重试</button></header><p class="muted">白名单自动打开 · 黑名单优先阻止 · 其他链接需确认</p><section class="editor"><h2 id="editorTitle">添加名单</h2><form id="editor"><label>网址<input id="url" required type="url" maxlength="1600" placeholder="https://example.com/"></label><div class="fields"><label>名单<select id="kind"><option value="white">白名单</option><option value="black">黑名单</option></select></label><label>匹配范围<select id="scope"><option value="url">精确网址</option><option value="path">指定目录（以 / 结尾）</option><option value="site">整个网站（同源）</option></select></label></div><label>备注<input id="note" maxlength="80" placeholder="如：工作平台"></label><div class="editorActions"><button class="primary" type="submit">保存</button><button id="reset" type="button">取消编辑</button></div></form><p id="feedback" role="status" aria-live="polite"></p></section><section class="records"><div class="tools"><div class="filters" aria-label="筛选名单"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="white" aria-pressed="false">白名单</button><button data-filter="black" aria-pressed="false">黑名单</button></div><input id="search" type="search" placeholder="搜索网址或备注" aria-label="搜索网址或备注"></div><div class="bulkTools"><label class="inlineCheck"><input id="selectAll" type="checkbox">全选当前结果</label><span id="selection" class="muted">已选 0 条</span><button id="toWhite" type="button">转白</button><button id="toBlack" type="button">转黑</button><button id="deleteSelected" type="button">删除</button></div><div id="rows"></div></section><section class="editor"><h2>批量维护</h2><div class="editorActions"><button id="exportList" type="button">导出名单</button><button id="importList" type="button">导入名单</button><button id="restoreList" type="button">撤销上次修改</button></div><input id="importFile" type="file" accept=".json,application/json" hidden><p class="muted" id="backupInfo"></p><details><summary>批量添加网址</summary><label>每行一个网址<textarea id="batchUrls" rows="5" maxlength="500000" placeholder="https://example.com/"></textarea></label><div class="fields"><label>名单<select id="batchKind"><option value="white">白名单</option><option value="black">黑名单</option></select></label><label>统一备注<input id="batchNote" maxlength="80"></label></div><button id="batchAdd" type="button">预览添加</button></details><div id="preview" hidden><p id="previewText" role="status"></p><div id="previewRows"></div><div class="editorActions"><button id="applyPreview" class="primary" type="button">确认保存</button><button id="cancelPreview" type="button">取消</button></div></div><p id="batchFeedback" role="status" aria-live="polite"></p></section><section class="editor"><h2>规则测试</h2><label>网址<input id="testUrl" type="url" maxlength="1600" placeholder="https://example.com/"></label><button id="testRule" type="button">检测规则</button><p id="testResult" role="status" aria-live="polite"></p><small>只检查本地规则，不访问网站。</small></section><p class="muted">名单与备份保存在当前浏览器。导出文件包含完整名单，请妥善保管。</p></main><script src="ui-transport.js"></script><script src="policy.js"></script><script src="list-tools.js"></script><script src="lists.js"></script></body></html>
