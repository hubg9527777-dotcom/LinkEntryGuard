name: Build and publish LinkEntryGuard

on:
  push:
    tags:
      - 'v*'

permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify version and run tests
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p 'require("./manifest.json").version')"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag does not match manifest version"
            exit 1
          fi
          for source_file in *.js tests/*.js; do
            node --check "$source_file"
          done
          for test_file in tests/*.js; do
            node "$test_file"
          done

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the same tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Package extension from tracked files only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          git archive --format=zip --output="dist/LinkEntryGuard-${GITHUB_REF_NAME}.zip" HEAD -- \
            manifest.json background.js policy.js page-click-guard.js teams-guard.js \
            floating-label.js ui-transport.js confirm.html confirm.js confirm.css \
            popup.html popup.js popup.css lists.html lists.js lists.css list-quick.js list-tools.js \
            icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png icons/incognito.svg \
            rules/failsafe.json README.md
          unzip -t "dist/LinkEntryGuard-${GITHUB_REF_NAME}.zip" | tail -1
          sha256sum "dist/LinkEntryGuard-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/LinkEntryGuard-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LinkEntryGuard $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
