<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkEntryGuard · 打开链接</title><link rel="stylesheet" href="confirm.css"></head>
<body>
  <main class="panel" aria-labelledby="heading">
    <header class="header"><div class="brand"><span class="shield" aria-hidden="true">✚</span><span>LinkEntryGuard</span></div><span id="profileName" class="profile" title="当前浏览器备注">当前浏览器</span></header>
    <h1 id="heading">打开链接</h1>
    <section class="target" aria-label="目标网址"><div class="eyebrow">准备访问</div><strong id="domain">正在检查网址…</strong><div id="address" class="address"></div></section>
    <div class="actions">
      <button id="approve" class="normal" disabled>直接打开</button>
      <button id="incognito" class="private" disabled><img src="icons/incognito.svg" width="21" height="21" alt="">无痕打开</button>
    </div>
    <button id="cancel" class="cancel">取消访问</button>
    <div id="status" role="status" class="status" aria-live="polite"></div>
  </main>
  <script src="confirm.js"></script>
  <script src="floating-label.js"></script>
</body></html>
